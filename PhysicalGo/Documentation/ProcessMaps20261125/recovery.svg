<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1530" width="1120" height="1530" role="img" aria-labelledby="recovery-title recovery-desc">
<title id="recovery-title">6 · One recovery owner; full OFF remains the fallback</title><desc id="recovery-desc">Typed eligibility allows a bounded attempt, not continued authority. Nested observations share one operation/controller scope and deadline.</desc>
