<polyline points="550.0,316.0 550.0,420.0" fill="none" stroke="#5e6c7d" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="550.0,516.0 550.0,820.0" fill="none" stroke="#5e6c7d" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="900.0,316.0 900.0,420.0" fill="none" stroke="#5e6c7d" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="900.0,516.0 900.0,620.0" fill="none" stroke="#5e6c7d" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="900.0,716.0 900,780 550,780 550.0,820.0" fill="none" stroke="#5e6c7d" stroke-width="1.6" marker-end="url(#arrow)"/>
<text class="edge-label" x="725.0" y="772.0" text-anchor="middle">new optical proof</text>
<polyline points="350.0,1068.0 400.0,1068.0" fill="none" stroke="#5e6c7d" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="700.0,1068.0 750.0,1068.0" fill="none" stroke="#5e6c7d" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="900.0,1116.0 900.0,1220.0" fill="none" stroke="#5e6c7d" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="900.0,1316.0 900,1448 700.0,1448.0" fill="none" stroke="#5e6c7d" stroke-width="1.6" marker-end="url(#arrow)"/>
<text class="edge-label" x="800.0" y="1440.0" text-anchor="middle">fresh evidence</text>
<g data-node="input"><rect x="400" y="25" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="414" y="52">Held crossing / typed failure</text>
<text class="node-body" x="414" y="79">Withdraw adequate immediately</text>
<text class="node-body" x="414" y="100">Enter existing shared work ledger</text>
</g>
<g data-node="cross"><rect x="50" y="220" width="300" height="96" rx="8" fill="#fff4d9" stroke="#805d16"/>
<text class="node-title" x="64" y="247">Measured error &gt;0.20 cell</text>
<text class="node-body" x="64" y="274">Newer full-board confirmation</text>
<text class="node-body" x="64" y="295">No wider adequate band</text>
</g>
<g data-node="expiry"><rect x="400" y="220" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="414" y="247">Finite optical-result expiry</text>
<text class="node-body" x="414" y="274">Discard old result; check live safety</text>
<text class="node-body" x="414" y="295">Reacquire pose + newer full-board data</text>
</g>
<g data-node="geometry"><rect x="750" y="220" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="764" y="247">Coherent geometry candidate</text>
<text class="node-body" x="764" y="274">DARK first, including PREPARE</text>
<text class="node-body" x="764" y="295">Assess exact rejected pixels only</text>
</g>
<g data-node="confirm"><rect x="50" y="420" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="64" y="447">Confirmation still outside?</text>
<text class="node-body" x="64" y="474">Use contained local correction</text>
<text class="node-body" x="64" y="495">Then independent held observation</text>
</g>
<g data-node="fresh"><rect x="400" y="420" width="300" height="96" rx="8" fill="#fff4d9" stroke="#805d16"/>
<text class="node-title" x="414" y="447">Same operation / current proof</text>
<text class="node-body" x="414" y="474">Original target, token and session</text>
<text class="node-body" x="414" y="495">Only acknowledged own RS may advance</text>
</g>
<g data-node="fit"><rect x="750" y="420" width="300" height="96" rx="8" fill="#fff4d9" stroke="#805d16"/>
<text class="node-title" x="764" y="447">Qualify replacement geometry</text>
<text class="node-body" x="764" y="474">Three newer dark frames; validate</text>
<text class="node-body" x="764" y="495">Install only after replacement passes</text>
</g>
<g data-node="hint"><rect x="750" y="620" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="764" y="647">Historical containment only</text>
<text class="node-body" x="764" y="674">Old sample/H grants no movement</text>
<text class="node-body" x="764" y="695">Fresh pose + full-board spot required</text>
</g>
<g data-node="adequate"><rect x="400" y="820" width="300" height="96" rx="8" fill="#fff4d9" stroke="#805d16"/>
<text class="node-title" x="414" y="847">Current adequate publication</text>
<text class="node-body" x="414" y="874">Same-sample age / pose / hand checks</text>
<text class="node-body" x="414" y="895">Cue age recheck is forthcoming</text>
</g>
<g data-node="lease"><rect x="50" y="620" width="300" height="96" rx="8" fill="#fff4d9" stroke="#805d16"/>
<text class="node-title" x="64" y="647">Shared finite recovery episode</text>
<text class="node-body" x="64" y="674">≤30s provisional wall cap</text>
<text class="node-body" x="64" y="695">Nested retries never restart it</text>
</g>
<g data-node="failure"><rect x="50" y="1020" width="300" height="96" rx="8" fill="#fff0ef" stroke="#99433b" stroke-dasharray="5 3"/>
<text class="node-title" x="64" y="1047">Any unqualified failure</text>
<text class="node-body" x="64" y="1074">Unknown hand/spot, lost lease,</text>
<text class="node-body" x="64" y="1095">transport, identity or exhausted work</text>
</g>
<g data-node="cancel"><rect x="400" y="1020" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="414" y="1047">Revoke → quiesce → full OFF</text>
<text class="node-body" x="414" y="1074">Coordinator owns stop + receipt</text>
<text class="node-body" x="414" y="1095">No transport writes inside validators</text>
</g>
<g data-node="off"><rect x="750" y="1020" width="300" height="96" rx="8" fill="#fff4d9" stroke="#805d16"/>
<text class="node-title" x="764" y="1047">Full OFF acknowledgement</text>
<text class="node-body" x="764" y="1074">Beam off + motor power released</text>
<text class="node-body" x="764" y="1095">Not merely DARK with motors held</text>
</g>
<g data-node="dark"><rect x="750" y="1220" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="764" y="1247">Post-dark physical evidence</text>
<text class="node-body" x="764" y="1274">Same stream + watermark + flush</text>
<text class="node-body" x="764" y="1295">No stone acceptance from a receipt</text>
</g>
<g data-node="resume"><rect x="400" y="1400" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="414" y="1427">Native recovery / explicit Resume</text>
<text class="node-body" x="414" y="1454">Preserve pending move and clocks</text>
<text class="node-body" x="414" y="1475">Hardware recovery cannot resume game</text>
</g>
<text x="30" y="1520" style="font-size:12px;fill:#5e6c7d">FULL-BATCH SOURCE CANDIDATE · native d014c63 / host 74d0b83 · Installed limited pair: fb4697c / 8ce91a1</text>
</svg>