<text class="edge-label" x="200.0" y="935.0" text-anchor="middle">published sample</text>
<g data-node="admit"><rect x="50" y="30" width="300" height="96" rx="8" fill="#fff4d9" stroke="#805d16"/>
<text class="node-title" x="64" y="57">Admit current request</text>
<text class="node-body" x="64" y="84">Binding + fresh frame + identity</text>
<text class="node-body" x="64" y="105">Historical anchor is only a hint</text>
</g>
<g data-node="arm"><rect x="400" y="30" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="414" y="57">Cold GA / warm RS</text>
<text class="node-body" x="414" y="84">Dark engagement; phase evidence</text>
<text class="node-body" x="414" y="105">No admission-clock reset on retry</text>
</g>
<g data-node="prepare"><rect x="400" y="210" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="414" y="237">Prepare while dark</text>
<text class="node-body" x="414" y="264">Three new dark frames + grid fit</text>
<text class="node-body" x="414" y="285">Fresh actual pose + first-light proof</text>
</g>
<g data-node="initial"><rect x="400" y="395" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="414" y="422">Measure actual spot</text>
<text class="node-body" x="414" y="449">SWEEP + fresh stationary batch</text>
<text class="node-body" x="414" y="470">Post-image causal motor evidence</text>
</g>
<g data-node="coarse"><rect x="50" y="585" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="64" y="612">Initial predicted travel once</text>
<text class="node-body" x="64" y="639">Dark contained coarse waypoints</text>
<text class="node-body" x="64" y="660">Same active time; separate step cap</text>
</g>
<g data-node="observe"><rect x="50" y="790" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="64" y="817">Observe actual landing</text>
<text class="node-body" x="64" y="844">Coarse / recovery: full-board batch</text>
<text class="node-body" x="64" y="865">Ordinary fine: measured near estimate</text>
</g>
<g data-node="fine"><rect x="400" y="790" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="414" y="817">Contained local correction</text>
<text class="node-body" x="414" y="844">Charge shared correction-plan ledger</text>
<text class="node-body" x="414" y="865">Fresh settled frame fence; remeasure</text>
</g>
<g data-node="accept"><rect x="750" y="585" width="300" height="96" rx="8" fill="#fff4d9" stroke="#805d16"/>
<text class="node-title" x="764" y="612">Within 0.20 cell</text>
<text class="node-body" x="764" y="639">Fresh optical target acceptance</text>
<text class="node-body" x="764" y="660">Keep accepted beam if eligible</text>
</g>
<g data-node="hold"><rect x="750" y="790" width="300" height="96" rx="8" fill="#fff4d9" stroke="#805d16"/>
<text class="node-title" x="764" y="817">Independent held verification</text>
<text class="node-body" x="764" y="844">Recheck exact evidence + scope</text>
<text class="node-body" x="764" y="865">Publish adequate; then native cue</text>
</g>
<g data-node="monitor"><rect x="750" y="1000" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="764" y="1027">Monitor current held target</text>
<text class="node-body" x="764" y="1054">Outside band → withdraw adequate</text>
<text class="node-body" x="764" y="1075">Fresh confirmation → bounded repair</text>
</g>
<g data-node="renew"><rect x="400" y="1190" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="414" y="1217">Renew geometry certificate</text>
<text class="node-body" x="414" y="1244">Fresh fixed-anchor lit proof if valid</text>
<text class="node-body" x="414" y="1265">Defer optional work / DARK fallback</text>
</g>
<g data-node="anchor"><rect x="50" y="1000" width="300" height="96" rx="8" fill="#edf5ef" stroke="#386347"/>
<text class="node-title" x="64" y="1027">Persist historical measured hint</text>
<text class="node-body" x="64" y="1054">After gated optical publication</text>
<text class="node-body" x="64" y="1075">Valid even if requested target missed</text>
</g>
<g data-node="placement"><rect x="750" y="1190" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="764" y="1217">Hand / placement / new intent</text>
<text class="node-body" x="764" y="1244">Revoke old operation → dark/OFF</text>
<text class="node-body" x="764" y="1265">Native independently confirms stone</text>
</g>
<g data-node="budget"><rect x="50" y="1190" width="300" height="96" rx="8" fill="#fff4d9" stroke="#805d16"/>
<text class="node-title" x="64" y="1217">One work ledger</text>
<text class="node-body" x="64" y="1244">150s active / 25 local plans</text>
<text class="node-body" x="64" y="1265">Stable adequate waiting excluded</text>
</g>
