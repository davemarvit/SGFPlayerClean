<g data-node="setup"><rect x="50" y="35" width="300" height="96" rx="8" fill="#fff4d9" stroke="#805d16"/>
<text class="node-title" x="64" y="62">A. Qualify the setup</text>
<text class="node-body" x="64" y="89">Grid + motor map + wood profile</text>
<text class="node-body" x="64" y="110">Independent checks + fresh READY</text>
</g>
<g data-node="camera"><rect x="50" y="225" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="64" y="252">B. Observe the board</text>
<text class="node-body" x="64" y="279">One app camera; fresh frames</text>
<text class="node-body" x="64" y="300">Hand, grid, stones, uncertainty</text>
</g>
<g data-node="game"><rect x="400" y="225" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="414" y="252">C. Decide and preserve</text>
<text class="node-body" x="414" y="279">Local recorder / AI / online</text>
<text class="node-body" x="414" y="300">Legal history + clocks + save</text>
</g>
<g data-node="guide"><rect x="750" y="225" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="764" y="252">D. Request guidance</text>
<text class="node-body" x="764" y="279">AI placement → capture → hint</text>
<text class="node-body" x="764" y="300">Exact target + bounded lease</text>
</g>
<g data-node="host"><rect x="750" y="415" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="764" y="442">E. Aim and monitor</text>
<text class="node-body" x="764" y="469">Measure → hold → bounded recovery</text>
<text class="node-body" x="764" y="490">Lost authority → full OFF</text>
</g>
<g data-node="human"><rect x="400" y="415" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="414" y="442">F. Human changes board</text>
<text class="node-body" x="414" y="469">Place indicated stone; remove</text>
<text class="node-body" x="414" y="490">captures; center when needed</text>
</g>
<g data-node="confirm"><rect x="50" y="415" width="300" height="96" rx="8" fill="#fff4d9" stroke="#805d16"/>
<text class="node-title" x="64" y="442">G. Verify physical change</text>
<text class="node-body" x="64" y="469">Clear, dark, fresh evidence</text>
<text class="node-body" x="64" y="490">Stable legal / cleanup result</text>
</g>
<g data-node="save"><rect x="400" y="625" width="300" height="96" rx="8" fill="#eaf2ff" stroke="#23538a"/>
<text class="node-title" x="414" y="652">Review / end / restore</text>
<text class="node-body" x="414" y="679">Preserve pending physical work</text>
<text class="node-body" x="414" y="700">Explicit scoring / resume</text>
</g>
<g data-node="fault"><rect x="750" y="625" width="300" height="96" rx="8" fill="#fff0ef" stroke="#99433b" stroke-dasharray="5 3"/>
<text class="node-title" x="764" y="652">Fault or pause → request OFF</text>
<text class="node-body" x="764" y="679">Require beam / motor OFF receipt</text>
<text class="node-body" x="764" y="700">Missing receipt remains unknown</text>
</g>
<text x="30" y="780" style="font-size:12px;fill:#5e6c7d">DIAGNOSTICS CANDIDATE 0.270 · be8befe / 936bf10 · Installed0.269; physical acceptance OPEN</text>
